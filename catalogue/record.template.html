<!-- Record pages load NO external JS (§2.9/B-S): one minimal inline script —
     the theme toggle (the catalogue twin) and the digest copy buttons
     (navigator.clipboard, graceful no-op). -->
<script>
(function () {
  var button = document.getElementById('bw-theme-toggle');
  try {
    var stored = localStorage.getItem('bw-theme');
    if (stored === 'light' || stored === 'dark') {
      document.documentElement.setAttribute('data-theme', stored);
    }
  } catch (err) { /* storage unavailable — the media default stands */ }
  if (button) {
    button.addEventListener('click', function () {
      var root = document.documentElement;
      var current =
        root.getAttribute('data-theme') ||
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light');
      var next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('bw-theme', next); } catch (err) { /* as above */ }
    });
  }
  Array.prototype.forEach.call(
    document.querySelectorAll('button[data-bw-copy]'),
    function (copyButton) {
      copyButton.addEventListener('click', function () {
        var value = copyButton.getAttribute('data-bw-copy') || '';
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(value).catch(function () { /* no-op */ });
        }
      });
    }
  );
})();
</script>
