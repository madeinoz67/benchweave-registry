name: pages

# The registry-hosted catalogue's deploy (issue #224 slice-2 pivot, §3.1).
#
# Posture (named, per the mechanism critic's Q8):
# - builds from MAIN ONLY — a PR never deploys;
# - the deploy job DEPENDS ON the validity job — a red validity never
#   deploys (records validity + release-status validity + index --check +
#   the unit suite, the same steps as records.yml);
# - the page is generated AT DEPLOY TIME from freshly generated index
#   bytes — a deploy of commit X serves X's catalogue by construction;
#   there is no committed page to drift;
# - the browser arm gates the deploy: a red arm never ships;
# - the deploy job runs ONLY on main and refuses a superseded run: a
#   pre-deploy step fetches main's tip and refuses with `deploy_superseded:`
#   when the run's own GITHUB_SHA is no longer it — re-running an old run
#   must not ship a stale page over a newer deployment (fold R3);
# - the Pages and id-token write grants live on the DEPLOY job alone; the
#   validity job needs and gets read only (fold R9);
# - a build failure leaves the previous deployment serving with a visible
#   failed-action status — disclosed, not hidden; cache fidelity is
#   GitHub's Pages pipeline (immutable per-deploy URLs; no app-level
#   cache to lie).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - name: Sync environment
        run: uv sync --locked
      - name: Records validity (CR-9/10/56/60, CR-38, CR-35)
        run: uv run python scripts/validate_records.py
      - name: Release-status validity (issue #224 pivot §3.2)
        run: uv run python scripts/validate_release_status.py
      - name: Index regeneration check (CR-21)
        run: uv run python scripts/generate_index.py --check
      - name: Unit tests (catalogue + validity arms)
        run: uv run pytest -q -m "not browser"

  deploy:
    needs: validity
    # Fold R3a: a workflow_dispatch on a branch reaches the validity job but
    # must never ship a page — only main deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Fold R9: the Pages/id-token write grants live HERE, on the only job
    # that deploys; the validity job runs on the workflow-level read grant.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse if main has moved (deploy_superseded)
        # Fold R3b: the re-run of an old run must not ship a stale page over
        # a newer deployment — this run's sha must still be main's tip.
        run: |
          set -euo pipefail
          git fetch origin main
          main_tip="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$main_tip" ]; then
            echo "deploy_superseded: this run's $GITHUB_SHA is no longer main's tip $main_tip — refusing to deploy a stale page (re-run from the current tip)" >&2
            exit 1
          fi
          echo "deploy current: $GITHUB_SHA is main's tip"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - name: Sync environment
        run: uv sync --locked
      - name: Generate index + catalogue page (deploy-time, §3.1)
        run: |
          set -euo pipefail
          uv run python scripts/generate_index.py
          uv run python scripts/generate_catalogue_page.py --dest _site --sha "${GITHUB_SHA}" --registry-mark
      - name: Browser verification of the generated artifact (B4')
        run: |
          set -euo pipefail
          uv run --with playwright python -m playwright install chromium --with-deps
          uv run --with playwright python scripts/verify_catalogue_browser.py --dest _site
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
