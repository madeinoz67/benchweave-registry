name: sync-index

# The plugin-catalogue sync, human-run (issue #224 slice 2).
#
# Owner ruling 2026-10-02: MANUAL-ONLY — no GATEWAY_SYNC_TOKEN, no bot PRs.
# This workflow is dispatched by a human and never writes to the gateway
# repository. It computes the sync and either certifies lockstep or hands
# the maintainer the exact files the sync needs; the write path is the
# documented command sequence in the README ("Keeping the gateway catalogue
# in sync"), and the gateway PR goes through the ordinary review flow.
#
# The drift gates enforce lockstep meanwhile: records.yml's mirror-drift job
# (push to main), the gateway's render guard (panel_drift:), and the
# gateway's authority pin (mirror_authority_drift:).

on:
  workflow_dispatch:

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Sync environment
        run: uv sync --locked
      - name: The registry tree must be current
        run: uv run python scripts/generate_index.py --check
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: madeinoz67/benchweave
          path: gateway
      - name: Compute the sync triple (mirror + pin + panel block)
        run: |
          set -euo pipefail
          cp index.json gateway/website/plugins-index.json
          printf '%s\n' "${GITHUB_SHA}" > gateway/website/plugins-index.ref
          python gateway/scripts/website/render_plugins_panel.py --root gateway --write
          git -C gateway add -N website/plugins-index.json website/plugins-index.ref
          if [ -z "$(git -C gateway status --porcelain -- website/plugins-index.json website/plugins-index.ref website/index.html)" ]; then
            echo "sync current: the gateway's mirror, pin and panel block match this registry commit"
            exit 0
          fi
          echo "::error::sync_required: the gateway's catalogue mirror is out of sync with ${GITHUB_SHA}"
          echo "Run the documented manual sync from a maintainer checkout with both repositories"
          echo "(README, 'Keeping the gateway catalogue in sync') and open the gateway PR:"
          echo "  cp index.json <gateway>/website/plugins-index.json"
          echo "  printf '%s\\n' ${GITHUB_SHA} > <gateway>/website/plugins-index.ref"
          echo "  python <gateway>/scripts/website/render_plugins_panel.py --root <gateway> --write"
          mkdir -p sync-bundle
          cp gateway/website/plugins-index.json sync-bundle/
          cp gateway/website/plugins-index.ref sync-bundle/
          cp gateway/website/index.html sync-bundle/
          exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: sync-bundle
          path: sync-bundle
